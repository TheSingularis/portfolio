<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/override.css">
  {% seo %}
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">{{ site.title }}</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/projects">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container py-5">
    <div class="row">
      <div class="col-md-8 mx-auto">
        <div class="card mb-4">
          <img src="{{ page.image }}" class="card-img-top" alt="{{ page.title }} screenshot">
          <div class="card-body">
            <h1 class="card-title">{{ page.title }}</h1>
            <p class="card-text">{{ page.description }}</p>
            <a href="{{ page.itch_link }}" class="btn btn-primary" target="_blank">Play on itch.io</a>
            {% if page.github_link %}
              <a href="{{ page.github_link }}" class="btn btn-outline-secondary ms-2" target="_blank">View Code</a>
            {% endif %}
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer class="text-center py-4 mt-5 bg-light">
    <small>&copy; {{ site.title }} {{ site.time | date: '%Y' }}</small>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
